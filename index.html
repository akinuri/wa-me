<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WhatsApp Link Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 to-teal-100 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-white text-xl">
        💬
      </div>
      <div>
        <h1 class="text-xl font-semibold text-gray-800">WhatsApp Link Generator</h1>
        <p class="text-sm text-gray-500">Create a wa.me chat link instantly</p>
      </div>
    </div>

    <form id="wa-form" class="space-y-4">
      <div>
        <label for="phone-number" class="block text-sm font-medium text-gray-700 mb-1">Phone number</label>
        <div class="flex gap-2">
          <input
            id="country-code"
            type="text"
            inputmode="numeric"
            placeholder="+1"
            value="+90"
            class="w-20 shrink-0 rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400"
            required
          />
          <input
            id="phone-number"
            type="text"
            inputmode="numeric"
            placeholder="555 123 45 67"
            class="flex-1 rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400"
            required
          />
        </div>
      </div>

      <div class="flex flex-col sm:flex-row gap-2">
        <button
          id="copy-btn"
          type="button"
          class="w-full sm:w-auto shrink-0 bg-gray-200 hover:bg-gray-300 text-gray-900 font-medium rounded-lg px-3 py-2.5 text-sm transition-colors"
        >
          Copy
        </button>
        <a
          id="open-btn"
          href="https://wa.me/"
          target="_blank"
          rel="noopener noreferrer"
          class="w-full sm:flex-1 flex items-center justify-center bg-emerald-500 hover:bg-emerald-600 text-white font-medium rounded-lg px-3 py-2.5 text-sm transition-colors"
        >
          Open in WhatsApp
        </a>
        <a
          id="open-web-btn"
          href="https://web.whatsapp.com/send/"
          target="_blank"
          rel="noopener noreferrer"
          class="w-full sm:flex-1 flex items-center justify-center bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-lg px-3 py-2.5 text-sm transition-colors"
        >
          Open in Web
        </a>
      </div>
    </form>

    <p id="error" class="mt-3 text-sm text-red-500 hidden"></p>
  </div>

  <script>
    const form = document.getElementById('wa-form');
    const countryCodeInput = document.getElementById('country-code');
    const phoneNumberInput = document.getElementById('phone-number');
    const copyBtn = document.getElementById('copy-btn');
    const openBtn = document.getElementById('open-btn');
    const openWebBtn = document.getElementById('open-web-btn');
    const errorEl = document.getElementById('error');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    function clearError() {
      errorEl.classList.add('hidden');
      errorEl.textContent = '';
    }

    const digitsOnly = (value) => value.replace(/\D/g, '');

    function debounce(fn, delay) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    const normalizeCountryCode = debounce(() => {
      const digits = digitsOnly(countryCodeInput.value);
      countryCodeInput.value = digits ? `+${digits}` : '';
    }, 500);

    const normalizePhoneNumber = debounce(() => {
      const kept = phoneNumberInput.value.replace(/[^\d\s]/g, '');
      phoneNumberInput.value = kept.replace(/^0+\s*/, '');
    }, 500);

    function getFullNumber() {
      const countryCode = digitsOnly(countryCodeInput.value);
      const phoneNumber = digitsOnly(phoneNumberInput.value).replace(/^0+/, '');
      return { countryCode, phoneNumber };
    }

    function buildUrl() {
      const { countryCode, phoneNumber } = getFullNumber();

      if (!countryCode || !phoneNumber) {
        showError('Please enter a valid country code and phone number.');
        return null;
      }

      clearError();
      return `https://wa.me/${countryCode}${phoneNumber}`;
    }

    function updateOpenLink() {
      const { countryCode, phoneNumber } = getFullNumber();
      const fullNumber = `${countryCode}${phoneNumber}`;
      openBtn.href = `https://wa.me/${fullNumber}`;
      openWebBtn.href = `https://web.whatsapp.com/send/?phone=${fullNumber}&text&type=phone_number&app_absent=0`;
    }

    function prefillFromUrl() {
      const search = window.location.search;
      if (!search) return;

      // supports ?phone=<number> as well as a bare ?<number> with no key
      const phoneParam = new URLSearchParams(search).get('phone');
      const raw = phoneParam ?? decodeURIComponent(search.slice(1));
      if (raw) {
        phoneNumberInput.value = raw;
      }

      history.replaceState(null, '', window.location.pathname);
    }

    prefillFromUrl();
    countryCodeInput.addEventListener('input', () => {
      updateOpenLink();
      normalizeCountryCode();
    });
    phoneNumberInput.addEventListener('input', () => {
      updateOpenLink();
      normalizePhoneNumber();
    });
    updateOpenLink();

    copyBtn.addEventListener('click', async () => {
      const url = buildUrl();
      if (!url) return;

      try {
        await navigator.clipboard.writeText(url);
        const original = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        setTimeout(() => (copyBtn.textContent = original), 1500);
      } catch {
        showError('Could not copy link.');
      }
    });

    openBtn.addEventListener('click', (e) => {
      if (!buildUrl()) {
        e.preventDefault();
      }
    });

    openWebBtn.addEventListener('click', (e) => {
      if (!buildUrl()) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
